[package]
name = "rexui-chat"
description = "A moq-room chat client for a rexui Process: JSON lines on stdin and stdout"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[[bin]]
name = "rexui-chat"
path = "src/main.rs"

[dependencies]
moq-net = "0.3.18"
moq-room = "0.2.19"
moq-tokio = "0.19.31"
anyhow = "1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync", "time"] }
url = "2"

[workspace]
